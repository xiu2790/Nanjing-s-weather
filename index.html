  <script>
  (() => {

    const VIEW_TILT=Math.SQRT1_2;
    function temperatureHue(temp){return 212-(Math.max(14,Math.min(32,temp))-14)*(197/18);}
    function temperatureGradient(ctx,cx,cy,ry){const g=ctx.createLinearGradient(cx,cy-ry*.86*VIEW_TILT,cx,cy+ry*.86*VIEW_TILT);g.addColorStop(0,'hsla('+temperatureHue(14)+',50%,55%,1)');g.addColorStop(.25,'hsla('+temperatureHue(18.5)+',48%,54%,1)');g.addColorStop(.52,'hsla('+temperatureHue(23)+',46%,53%,1)');g.addColorStop(.78,'hsla('+temperatureHue(28)+',50%,54%,1)');g.addColorStop(1,'hsla('+temperatureHue(32)+',55%,55%,1)');return g;}
